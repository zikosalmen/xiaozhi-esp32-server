# Docker安装全模块 - Hbiba ESP32 Server

services:
  # ===== Server IA principal (Hbiba) =====
  hbiba-esp32-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: hbiba-esp32-server
    depends_on:
      hbiba-esp32-server-db:
        condition: service_healthy
      hbiba-esp32-server-redis:
        condition: service_healthy
    restart: always
    networks:
      - default
    ports:
      - "8000:8000"
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./plugins_func:/opt/xiaozhi-esp32-server/plugins_func
      - ./core:/opt/xiaozhi-esp32-server/core
      - ./app.py:/opt/xiaozhi-esp32-server/app.py

  # ===== Dashboard Web - expose interne seulement (nginx route vers lui) =====
  hbiba-esp32-server-web:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: hbiba-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      hbiba-esp32-server-db:
        condition: service_healthy
      hbiba-esp32-server-redis:
        condition: service_healthy
    expose:
      - 8002
    environment:
      - TZ=UTC
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://hbiba-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=Hbiba@2026!
      - SPRING_DATA_REDIS_HOST=hbiba-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./uploadfile:/uploadfile

  # ===== MySQL =====
  hbiba-esp32-server-db:
    image: mysql:latest
    container_name: hbiba-esp32-server-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=UTC
      - MYSQL_ROOT_PASSWORD=Hbiba@2026!
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_ROOT_HOST=%

  # ===== Redis =====
  hbiba-esp32-server-redis:
    image: redis:8.0
    container_name: hbiba-esp32-server-redis
    expose:
      - 6379
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # ===== Nginx - Point d'entree Cloudflare (port 80) =====
  # Cloudflare (HTTPS) -> ce container (HTTP:80)
  # /xiaozhi/*  -> hbiba-esp32-server:8003  (Python IA + robot)
  # /*          -> hbiba-esp32-server-web:8002  (Dashboard Java)
  hbiba-nginx:
    image: nginx:alpine
    container_name: hbiba-nginx
    restart: always
    networks:
      - default
    depends_on:
      - hbiba-esp32-server
      - hbiba-esp32-server-web
    ports:
      - "80:80"
      - "8002:8002"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
