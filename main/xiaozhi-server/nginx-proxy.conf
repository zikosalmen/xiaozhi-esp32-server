# nginx-proxy.conf
# Point d'entree pour Cloudflare (HTTP port 80)
# Cloudflare gere le HTTPS — ce nginx gere juste le routing interne

# Gestion upgrade WebSocket
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}

server {
    listen 80;
    listen 8002;
    server_name _;

    client_max_body_size 100M;
    keepalive_timeout 300;

    # ==== 1. Robot RC-Car (Python xiaozhi-server : 8003) ====
    location /xiaozhi/robot/ {
        proxy_pass         http://hbiba-esp32-server:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ==== 2. OTA updates (Python xiaozhi-server : 8003) ====
    location /xiaozhi/ota/ {
        proxy_pass         http://hbiba-esp32-server:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ==== 3. WebSocket IA ESP32 (/xiaozhi/v1/ -> Python port 8000) ====
    location /xiaozhi/v1/ {
        proxy_pass         http://hbiba-esp32-server:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # Cloudflare Enterprise keepalive (Free plan coupe a ~100s)
        # Le ping WebSocket cote serveur Python doit etre active
    }

    # ==== /mcp/* → Python xiaozhi-server (vision, MCP) ====
    location /mcp/ {
        proxy_pass       http://hbiba-esp32-server:8003;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ==== Tout le reste → Dashboard Java (port 8002) ====
    location / {
        proxy_pass         http://hbiba-esp32-server-web:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}

