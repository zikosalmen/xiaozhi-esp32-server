# nginx-proxy.conf
# Point d'entree pour Cloudflare (HTTP port 80)
# Cloudflare gere le HTTPS — ce nginx gere juste le routing interne

# Gestion upgrade WebSocket
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}

server {
    listen 80;
    listen 8002;
    server_name _;

    client_max_body_size 100M;
    keepalive_timeout 300;

    # ==== /xiaozhi/* → Python xiaozhi-server (port 8003) ====
    # Couvre : /xiaozhi/robot/move, /xiaozhi/robot/stop,
    #          /xiaozhi/ota/, /xiaozhi/v1/ (WebSocket), etc.
    location /xiaozhi/ {
        proxy_pass         http://hbiba-esp32-server:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # Support WebSocket (pour /xiaozhi/v1/)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    3600s;
    }

    # ==== /mcp/* → Python xiaozhi-server (vision, MCP) ====
    location /mcp/ {
        proxy_pass       http://hbiba-esp32-server:8003;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ==== Tout le reste → Dashboard Java (port 8002) ====
    location / {
        proxy_pass         http://hbiba-esp32-server-web:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}

